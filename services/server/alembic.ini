# Alembic config. Run it from services/server: `uv run alembic upgrade head`.
# The database URL is not set here: alembic/env.py reads it from tassel.config.Settings
# (env TASSEL_DATABASE_URL), so the same command migrates the dev and test databases.

[alembic]
script_location = %(here)s/alembic
path_separator = os

[post_write_hooks]
# Lint and format each new revision with ruff (run as a module, so it works on Windows too).
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
