[project]
name = "tassel-server"
description = "Tassel tutoring server: sessions API, device auth and storage."
requires-python = ">=3.12,<3.13"
dynamic = ["version"]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2",
    "psycopg[binary]>=3",
    "alembic",
]

[project.scripts]
tassel-server = "tassel.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.4",
    "httpx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tassel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tassel"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat the package as ours.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
